name: Docker image

# Builds the one image (API + Worker + Angular + Chromium, see Dockerfile) and pushes it to GitHub Container Registry:
#   ghcr.io/<owner>/job-scout:latest      – the newest build of main
#   ghcr.io/<owner>/job-scout:sha-<short> – every build, to deploy or roll back an exact version
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

# Actions are pinned to a commit (the comment says the version) – a moved tag of a third-party action can't
# change what builds the image; Dependabot updates the pins (14 Nov)
permissions:
  contents: read

jobs:
  image:
    # Only main is built and pushed – "Run workflow" on another branch must not overwrite :latest (14 Nov)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # push to ghcr.io with the workflow's own token – no stored password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/job-scout
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
