name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # "Run workflow" button in the Actions tab

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore JobScout.slnx

      - name: Build
        run: dotnet build JobScout.slnx --configuration Release --no-restore

      # No network and no LLM calls in tests – no API key needed
      - name: Test
        run: dotnet test JobScout.slnx --configuration Release --no-build --verbosity normal

      # Known vulnerabilities in NuGet packages (also the transitive ones) fail the build (13 Oct)
      - name: Vulnerable packages
        run: |
          dotnet list JobScout.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt

  # The Angular app (6f): unit tests (Vitest + jsdom, no browser needed) and the production build,
  # which also checks the size budgets. The build lands in src/JobScout.Api/wwwroot (angular.json).
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/JobScout.Web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/JobScout.Web/package-lock.json

      # The lock file was written by npm 11 (package.json "packageManager"); Node 22 ships npm 10, which reads
      # optional peer dependencies differently and calls the same lock file "out of sync" – use the same npm as locally
      - name: npm from packageManager
        run: npm install -g npm@$(node -p "require('./package.json').packageManager.split('@')[1]")

      - name: Install
        run: npm ci

      # Known high/critical vulnerabilities in what ships to the browser fail the build (dev tools are not shipped)
      - name: Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Test
        run: npx ng test --watch=false

      - name: Build
        run: npx ng build
