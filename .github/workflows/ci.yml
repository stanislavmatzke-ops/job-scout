name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # "Run workflow" button in the Actions tab

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore JobScout.slnx

      - name: Build
        run: dotnet build JobScout.slnx --configuration Release --no-restore

      # No network and no LLM calls in tests – no API key needed
      - name: Test
        run: dotnet test JobScout.slnx --configuration Release --no-build --verbosity normal
