name: CodeQL

# Static analysis (SAST) of the C# and TypeScript code – injections, unsafe deserialization, XSS, path traversal…
# (13 Oct, review against "vibe coding" risks). Free for public repositories; findings appear under Security → Code scanning.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'     # every Monday – new queries find old code too

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none            # no build needed – faster, and nothing to install
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
