# Dependabot (13 Oct): a pull request when a dependency has a known vulnerability or a new version –
# NuGet packages, the Angular app, the GitHub Actions and the Docker base images. Weekly, grouped, so it's not noisy.
# Major versions of the platform (Node, Angular, TypeScript, .NET images) are upgraded by hand, on purpose:
# they need a migration (ng update) and the same version in CI – security fixes inside a major still come automatically.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly }
    groups:
      nuget: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /src/JobScout.Web
    schedule: { interval: weekly }
    groups:
      angular: { patterns: ["@angular/*", "@angular-devkit/*"] }
      npm: { patterns: ["*"] }
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Angular's test builder says which Vitest it supports (@angular/build peer dependency) – it moves with Angular
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }       # one pull request for all the workflow actions, not one each
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: dotnet/*
        update-types: ["version-update:semver-major"]
